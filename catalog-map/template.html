<title>Skill Catalog Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky filter bar on top, summary strip, then tree/matrix of 38 artifacts; path panel at the bottom. */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#17202b; --muted:#5b6776; --line:#d9dfe6;
  --accent:#1f5fd6; --accent-soft:#e3ecfc;
  --g-de:#1f5fd6; --g-de-soft:#e3ecfc;
  --g-pb:#9a2f6a; --g-pb-soft:#f8e4ef;
  --g-tb:#b44a2a; --g-tb-soft:#fce9e2;
  --g-db:#0b7480; --g-db-soft:#dcf0f2;
  --g-ct:#a35a00; --g-ct-soft:#fbeed8;
  --g-ic:#7a3db8; --g-ic-soft:#efe4fa;
  --g-gn:#2c7a4b; --g-gn-soft:#def2e6;
  --warn:#b3261e; --warn-soft:#fbe4e2;
  --code:#eef1f5;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#171f29; --fg:#e6ebf1; --muted:#98a4b3; --line:#2a3542;
  --accent:#6b9cff; --accent-soft:#1b2a47;
  --g-de:#6b9cff; --g-de-soft:#1b2a47;
  --g-pb:#e58ab8; --g-pb-soft:#3a1828;
  --g-tb:#e8896a; --g-tb-soft:#3a1e16;
  --g-db:#4cc6d2; --g-db-soft:#12323a;
  --g-ct:#e8a045; --g-ct-soft:#3a2a12;
  --g-ic:#b98af0; --g-ic-soft:#2c1d42;
  --g-gn:#5cc489; --g-gn-soft:#14301f;
  --warn:#ff8a80; --warn-soft:#3d1c1a; --code:#1f2935; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#171f29; --fg:#e6ebf1; --muted:#98a4b3; --line:#2a3542;
  --accent:#6b9cff; --accent-soft:#1b2a47;
  --g-de:#6b9cff; --g-de-soft:#1b2a47;
  --g-pb:#e58ab8; --g-pb-soft:#3a1828;
  --g-tb:#e8896a; --g-tb-soft:#3a1e16;
  --g-db:#4cc6d2; --g-db-soft:#12323a;
  --g-ct:#e8a045; --g-ct-soft:#3a2a12;
  --g-ic:#b98af0; --g-ic-soft:#2c1d42;
  --g-gn:#5cc489; --g-gn-soft:#14301f;
  --warn:#ff8a80; --warn-soft:#3d1c1a; --code:#1f2935; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1{font-size:24px;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:16px;font-weight:600;margin:0}
.sub{color:var(--muted);margin:4px 0 0;max-width:65ch}
.ver{color:var(--muted);font-size:12px;margin:6px 0 0}
.ver a,.detail a{color:var(--accent)}
.detail .mono{overflow-wrap:anywhere;font-size:12.5px}
.mono{font-family:var(--mono)}
header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:12px}
.filters{padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
/* A chip list takes the space beside its label and wraps there, instead of dropping under it. */
.frow>.frow{flex:1 1 0;min-width:0}
.flabel{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:92px;flex:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px}
/* The new chip and the topic chips flow as one chip list. */
#f-new,#f-topic{display:contents}
.chip.new{font-weight:600}
.chip.new[aria-pressed="false"]{color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#0f151c}}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#0f151c}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#q{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.link{border:0;background:none;color:var(--accent);padding:4px}
.count{color:var(--muted);font-size:12px;margin-left:auto}
/* tree */
.group{display:flex;flex-direction:column;gap:8px}
.ghead{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:2px solid var(--gc)}
.ghead h2{color:var(--gc)}
.ghead small{color:var(--muted)}
.sg{margin-left:14px;padding-left:14px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.sgt{font-size:12px;color:var(--muted);font-weight:600;margin:6px 0 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.ihead{display:flex;align-items:flex-start}
.exp{flex:1 1 auto;min-width:0;text-align:left;background:none;border:0;padding:8px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:4px 12px;align-items:center}
.add{flex:none;margin:8px 10px 8px 0;border:1px solid var(--line);background:var(--surface);color:var(--accent);border-radius:6px;padding:2px 10px;font-size:12px;white-space:nowrap}
.add[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);font-weight:600}
td .add{margin:0;padding:0 8px}
/* basket: fixed to the bottom while something is selected */
.basket{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.basket[hidden]{display:none}
.bwrap{max-width:1100px;margin-inline:auto;display:flex;flex-direction:column;gap:8px}
.brow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brow b{font-variant-numeric:tabular-nums}
.bnote{color:var(--muted);font-size:12px}
.blist{display:flex;flex-wrap:wrap;gap:6px;max-height:30vh;overflow:auto}
.blist[hidden]{display:none}
.bchip{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:0 0 0 7px;background:var(--bg)}
.bchip button{border:0;background:none;color:var(--muted);padding:0 6px;font-size:14px;line-height:1.4}
.bspace{flex:1 1 auto}
.primary{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:6px;padding:6px 14px;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .primary{color:#0f151c}}
:root[data-theme="dark"] .primary{color:#0f151c}
body.has-basket{padding-bottom:120px}
.iid{font-family:var(--mono);font-size:12.5px;font-weight:500;overflow-wrap:anywhere}
.iname{color:var(--muted);font-size:13px;grid-column:1}
.tags{display:flex;flex-wrap:wrap;gap:4px;grid-column:1 / -1}
.tag{font-size:11px;padding:0 7px;border-radius:4px;background:var(--code);color:var(--muted);white-space:nowrap}
.tag.fw{background:var(--gs);color:var(--gc);font-weight:500}
.tag.req{background:none;box-shadow:inset 0 0 0 1px var(--line);color:var(--fg)}
.tag.new{background:var(--accent-soft);color:var(--accent);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.detail h4{font-size:12px;font-weight:600;margin:6px 0 0}
.detail{padding:4px 12px 12px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.detail>div{min-width:0}
.detail ul{margin:4px 0 0;padding-left:18px}
.detail h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 0;font-weight:600}
.detail p{margin:4px 0 0}
/* matrix */
.mwrap{overflow-x:auto;padding:0}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:12px}
th,td{padding:4px 6px;border-bottom:1px solid var(--line);text-align:center}
th{font-weight:500;color:var(--muted);position:sticky;top:0;background:var(--surface)}
th.rot{height:96px;vertical-align:bottom}
th.rot span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
td.l,th.l{text-align:left}
td.l{font-family:var(--mono);white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gc)}
tr.gh td{background:var(--code);font-weight:600;text-align:left;font-family:var(--font)}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.item,.chip{transition:background .12s,border-color .12s}}
</style>

<div class="wrap">
  <header>
    <div>
      <h1 data-i="title"></h1>
      <p class="sub" data-i="sub"></p>
      <p class="ver"><span data-i="forVersion"></span> <b class="mono">__VERSION__</b> · <a href="https://github.com/innowise-ai/data-accelerator-toolset" target="_blank" rel="noopener" data-i="repo"></a></p>
    </div>
    <div class="top">
      <div class="seg" role="group" aria-label="View">
        <button id="v-tree" aria-pressed="true" data-i="tree"></button>
        <button id="v-matrix" aria-pressed="false" data-i="matrix"></button>
      </div>
      <div class="seg" role="group" aria-label="Language">
        <button id="l-en" aria-pressed="true">EN</button>
        <button id="l-ru" aria-pressed="false">RU</button>
      </div>
    </div>
  </header>

  <div class="stats" id="stats"></div>

  <section class="panel filters" aria-label="Filters">
    <div class="top">
      <input id="q" type="search" data-ph="search" aria-label="Search">
      <span class="count" id="count"></span>
      <button class="link" id="add-shown"></button>
      <button class="link" id="reset" data-i="reset"></button>
    </div>
    <div class="frow"><span class="flabel" data-i="fTopic"></span><span class="frow"><span id="f-new"></span><span id="f-topic"></span></span></div>
    <div class="frow"><span class="flabel" data-i="fAp"></span><span id="f-ap" class="frow"></span></div>
  </section>

  <main id="main"></main>
</div>

<section class="basket" id="basket" aria-label="Selected skills" hidden>
  <div class="bwrap">
    <div class="brow">
      <b id="b-count"></b>
      <button class="link" id="b-toggle" aria-expanded="false"></button>
      <span class="bnote" id="b-note"></span>
      <span class="bspace"></span>
      <button class="link" id="b-clear" data-i="bClear"></button>
      <button class="primary" id="b-dl" data-i="bDl"></button>
    </div>
    <div class="blist" id="b-list" hidden></div>
  </div>
</section>

try { if (localStorage.getItem('skillmap-view') === 'matrix') st.view = 'matrix';
      if (localStorage.getItem('skillmap-lang') === 'ru') st.lang = 'ru';
      // A remembered id the current catalog no longer has is dropped.
      const ids = new Set(DATA.map(a=>a.id));
      JSON.parse(localStorage.getItem('skillmap-basket') || '[]').forEach(id => { if (ids.has(id)) st.basket.add(id); }); } catch(e){}

// ZIP:BEGIN Download ZIP: README text and a ZIP writer. tests/test_catalog_map_zip.py runs this block in Node.
// build.js stores each file as [path, crc32, size, mode, base64 of raw deflate], so entries go in finished.
const ZIP_TEXT = {
  en:{head:'Skills from the Data Accelerator toolset', ver:'Catalog version', date:'Downloaded',
      manual:['This is a manual install. These copies do not update, and Accelerator\'s update,',

  ru:{head:'Скиллы из Data Accelerator toolset', ver:'Версия каталога', date:'Скачано',
      manual:['Это ручная установка. Эти копии не обновляются, а команды Accelerator update,',

      agents:[['Claude Code','.claude/skills/ в проекте или ~/.claude/skills/ для всех проектов'],

      skills:'Скиллы', tools:'Нужно', access:'Доступы'}

function readme(ids, lang, now){
  const t = ZIP_TEXT[lang] || ZIP_TEXT.en;
  const ru = lang === 'ru';
  const lines = [t.head, '', `${t.ver}: ${REF}`, `${t.date}: ${now.toISOString().slice(0,10)}`, '', ...t.manual, '',
    t.where, t.whereText, ...t.agents.map(([a,p]) => `  ${a.padEnd(14)}${p}`), t.restart, '', ...t.clash, '',
    `${t.skills} (${ids.length})`];
  for (const id of ids){
    const a = DATA.find(x=>x.id===id);
    const rq = (ru && a.ru && a.ru.rq) ? a.ru.rq : a.rq;
    lines.push('', `  ${a.id}  ${a.v}`, `    ${(ru && a.ru) ? a.ru.n : a.n}`);
    if (rq && rq.tools && rq.tools.length) lines.push(`    ${t.tools}: ${rq.tools.join('; ')}`);
    if (rq && rq.access && rq.access.length) lines.push(`    ${t.access}: ${rq.access.join('; ')}`);

const CRC_T = new Uint32Array(256).map((_, n) => { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; return c >>> 0; });

// One folder per skill, named by its id as the installer names it, plus README.txt.
function bundle(ids, lang, now){
  const entries = [];
  for (const id of ids) for (const [p, crc, size, mode, packed] of FILES[id])
    entries.push({path:`${id}/${p}`, crc, size, mode, method:8, data:unb64(packed)});
  const text = new TextEncoder().encode(readme(ids, lang, now));
  entries.push({path:'README.txt', crc:crc32(text), size:text.length, mode:0o644, method:0, data:text});
  return entries;

  let off = 0;
  for (const e of entries){
    const name = enc.encode(e.path);
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, e.method, true);

    parts.push(new Uint8Array(h.buffer), name, e.data);
    const c = new DataView(new ArrayBuffer(46));
    // Made by Unix (3), so unzip on macOS and Linux applies the file mode in the high 16 bits.
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 0x0314, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
    c.setUint16(10, e.method, true); c.setUint16(12, time, true); c.setUint16(14, date, true); c.setUint32(16, e.crc, true);
    c.setUint32(20, e.data.length, true); c.setUint32(24, e.size, true); c.setUint16(28, name.length, true);
    c.setUint32(38, ((0o100000 | e.mode) << 16) >>> 0, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + e.data.length;
  }
  const size = central.reduce((s, p) => s + p.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true); end.setUint16(8, entries.length, true); end.setUint16(10, entries.length, true);
  end.setUint32(12, size, true); end.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(end.buffer)], {type:'application/zip'});
}
// ZIP:END

const $ = id => document.getElementById(id);
const tr = k => T[st.lang][k];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = (a,f) => (st.lang==='ru' && a.ru) ? a.ru[f] : a[f];
// Requirements fall back to English per artifact, since ru.json may lag behind index.json.
const RQ = a => (st.lang==='ru' && a.ru && a.ru.rq) ? a.ru.rq : a.rq;
const rqText = a => a.rq ? Object.values(a.rq).flat().join(' ') + (a.ru && a.ru.rq ? ' ' + Object.values(a.ru.rq).flat().join(' ') : '') : '';
const apList = a => [...(a.ap.frameworks||[]), ...(a.ap.languages||[])];
const apKey = a => [...(a.ap.frameworks||[]).map(x=>'fw:'+x), ...(a.ap.languages||[]).map(x=>'lang:'+x)];
const topics = [...new Set(DATA.flatMap(a=>a.t))].sort();
const aps = [...new Set(DATA.flatMap(apKey))].sort();
const apLabel = x => x.startsWith('fw:') ? x.slice(3) : tr('lang') + x.slice(5);

function buildChips(el, items, set, labelFn, cls=''){
  el.innerHTML = items.map(i => `<button class="chip ${cls}" data-v="${esc(i)}" aria-pressed="${set.has(i)}">${esc(labelFn(i))}</button>`).join('');
  el.onclick = e => { const b = e.target.closest('.chip'); if(!b) return;
    const v = b.dataset.v; set.has(v) ? set.delete(v) : set.add(v);
    b.setAttribute('aria-pressed', set.has(v)); render(); };
}
function match(a){
  if (st.q){ const h=(a.id+' '+a.n+' '+a.sum+' '+(a.ru?a.ru.n+' '+a.ru.sum:'')+' '+rqText(a)+(a.nw?' '+T.en.nw+' '+T.ru.nw:'')).toLowerCase(); if(!h.includes(st.q)) return false; }
  if (st.nw.size && !a.nw) return false;
  if (st.topics.size && ![...st.topics].every(t=>a.t.includes(t))) return false;
  if (st.ap.size && ![...st.ap].some(k=>apKey(a).includes(k))) return false;
  return true;
}
function tagsOf(a){
  let h = a.nw ? `<span class="tag new" title="${tr('nwTip')}">${tr('nw')}</span>` : '';
  h += a.t.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  h += apList(a).map(x=>`<span class="tag fw">${esc(x)}</span>`).join('');
  if (!apList(a).length) h += `<span class="tag">${tr('any')}</span>`;
  if (a.rq) h += `<span class="tag req">${tr('setup')}</span>`;
  return h;
}
function needsOf(a){
  const rq = RQ(a);
  if (!rq) return `<p>${tr('nothing')}</p>`;
  return ['tools','access'].filter(k=>rq[k] && rq[k].length)
    .map(k=>`<h4>${tr(k)}</h4><ul>${rq[k].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('');
}
function item(a, g){
  const open = st.open.has(a.id);
  const det = open ? `<div class="detail">
    <div><h3>${tr('what')}</h3><p>${esc(L(a,'sum'))}</p></div>
    <div><h3>${tr('benefits')}</h3><ul>${L(a,'b').map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
    <div><h3>${tr('needs')}</h3>${needsOf(a)}</div>
    <div><h3>${tr('where')}</h3><p class="mono"><a href="${REPO}/blob/${esc(REF)}/${esc(a.p)}/SKILL.md" target="_blank" rel="noopener">${esc(a.p)}/SKILL.md</a></p>
    <h3>${tr('ver')}</h3><p class="mono">${esc(a.v)}</p></div></div>` : '';
  return `<div class="item" style="--gc:var(${g.c});--gs:var(${g.s})"><div class="ihead">
    <button class="exp" data-id="${esc(a.id)}" aria-expanded="${open}">
      <span class="iid">${esc(a.id)}</span>
      <span class="iname">${esc(L(a,'n'))}</span>
      <span class="tags">${tagsOf(a)}</span>
    </button>${addBtn(a)}</div>${det}</div>`;
}
function addBtn(a){
  const on = st.basket.has(a.id);
  return `<button class="add" data-add="${esc(a.id)}" aria-pressed="${on}" aria-label="${esc((on ? tr('remove') : tr('add')) + ' ' + a.id)}">${on ? '✓ ' + tr('added') : tr('add')}</button>`;
}
// A skill can sit in several groups (a.gs is a list of [group, subgroup]); it shows once in each.
const inGroup = (a,k) => a.gs.some(p=>p[0]===k);
const subIn = (a,k) => a.gs.find(p=>p[0]===k)[1];
const subName = s => st.lang==='ru' ? (SUB_RU[s]||s) : s;
function renderTree(list){
  return GROUPS.map(g=>{
    const items = list.filter(a=>inGroup(a,g.k)); if(!items.length) return '';
    const subs = [...new Set(items.map(a=>subIn(a,g.k)))];
    return `<div class="group" style="--gc:var(${g.c})"><div class="ghead"><h2>${g.t[st.lang]}</h2><small>${items.length} ${tr('of')} ${DATA.filter(a=>inGroup(a,g.k)).length}</small></div>
      <div class="sg">${subs.map(s=>`<div class="sgt">${esc(subName(s))}</div>`+items.filter(a=>subIn(a,g.k)===s).map(a=>item(a,g)).join('')).join('')}</div></div>`;
  }).join('') || `<div class="panel empty">${tr('none')}</div>`;
}
function renderMatrix(list){
  if(!list.length) return `<div class="panel empty">${tr('none')}</div>`;
  const head = `<tr><th class="l">${tr('colSkill')}</th>${topics.map(t=>`<th class="rot"><span>${esc(t)}</span></th>`).join('')}<th>${tr('colAp')}</th><th></th></tr>`;
  let rows = '';
  GROUPS.forEach(g=>{ const items=list.filter(a=>inGroup(a,g.k)); if(!items.length) return;
    rows += `<tr class="gh"><td colspan="${topics.length+3}" style="color:var(${g.c})">${g.t[st.lang]}</td></tr>`;
    rows += items.map(a=>`<tr style="--gc:var(${g.c})"><td class="l">${esc(a.id)}</td>${topics.map(t=>`<td>${a.t.includes(t)?'<span class="dot"></span>':''}</td>`).join('')}<td class="mono">${esc(apList(a).join(', ')||'—')}</td><td>${addBtn(a)}</td></tr>`).join('');
  });
  return `<div class="panel mwrap"><table><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}
function stats(){
  const n = f => DATA.filter(f).length;
  $('stats').innerHTML = [[DATA.length,'s1'],[n(a=>inGroup(a,'Data engineering')),'s2'],[n(a=>inGroup(a,'Power BI')),'s7'],[n(a=>inGroup(a,'Tableau')),'s8'],[n(a=>inGroup(a,'Database administration')),'s6'],[n(a=>inGroup(a,'Containers')),'s3'],[n(a=>inGroup(a,'Infrastructure as code')),'s5'],[n(a=>inGroup(a,'General')),'s4']]
    .map(([v,l])=>`<div class="panel stat"><b>${v}</b><span>${tr(l)}</span></div>`).join('');
}
function i18n(){
  document.documentElement.lang = st.lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent = tr(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder = tr(e.dataset.ph));
  $('l-en').setAttribute('aria-pressed', st.lang==='en'); $('l-ru').setAttribute('aria-pressed', st.lang==='ru');
  // No chip when the release added nothing; the filter would show an empty list.
  const nNew = DATA.filter(a=>a.nw).length;
  buildChips($('f-new'), nNew ? ['new'] : [], st.nw, ()=>`${tr('nw')} (${nNew})`, 'new');
  buildChips($('f-topic'), topics, st.topics, x=>x);
  buildChips($('f-ap'), aps, st.ap, apLabel);
  stats();
}
function renderBasket(){
  const n = st.basket.size;
  $('basket').hidden = !n;
  document.body.classList.toggle('has-basket', n > 0);
  if (!n) { $('b-list').hidden = true; return; }
  const sel = DATA.filter(a=>st.basket.has(a.id));
  const k = sel.filter(a=>a.rq).length;
  $('b-count').textContent = tr('selected').replace('{n}', n);
  $('b-note').textContent = k ? tr('bNote').replace('{k}', k) : tr('bTip');
  const open = !$('b-list').hidden;
  $('b-toggle').textContent = open ? tr('bHide') : tr('bShow');
  $('b-toggle').setAttribute('aria-expanded', open);
  $('b-list').innerHTML = sel.map(a=>`<span class="bchip">${esc(a.id)}<button data-rm="${esc(a.id)}" aria-label="${esc(tr('remove') + ' ' + a.id)}">×</button></span>`).join('');
}
function render(){
  const list = DATA.filter(match);
  st.shown = list.map(a=>a.id);
  $('count').textContent = `${list.length} ${tr('of')} ${DATA.length}`;
  const missing = st.shown.filter(id=>!st.basket.has(id)).length;
  $('add-shown').hidden = !missing;
  $('add-shown').textContent = tr('addShown').replace('{n}', missing);
  $('main').innerHTML = `<div style="display:flex;flex-direction:column;gap:20px">${st.view==='tree'?renderTree(list):renderMatrix(list)}</div>`;
  $('v-tree').setAttribute('aria-pressed', st.view==='tree');
  $('v-matrix').setAttribute('aria-pressed', st.view==='matrix');
  renderBasket();
}
function saveBasket(){ try{localStorage.setItem('skillmap-basket', JSON.stringify([...st.basket]));}catch(e){} }
$('main').onclick = e => {
  const add = e.target.closest('.add');
  if (add){ const id = add.dataset.add; st.basket.has(id) ? st.basket.delete(id) : st.basket.add(id); saveBasket(); render();
    const nb = document.querySelector(`.add[data-add="${id}"]`); if (nb) nb.focus(); return; }
  const b=e.target.closest('.exp'); if(!b) return;
  const id=b.dataset.id; st.open.has(id)?st.open.delete(id):st.open.add(id); render();
  const nb=document.querySelector(`.exp[data-id="${id}"]`); if(nb) nb.focus(); };
$('add-shown').onclick = () => { st.shown.forEach(id=>st.basket.add(id)); saveBasket(); render(); };
$('b-list').onclick = e => { const b=e.target.closest('[data-rm]'); if(!b) return;
  st.basket.delete(b.dataset.rm); saveBasket(); render(); };
$('b-toggle').onclick = () => { $('b-list').hidden = !$('b-list').hidden; renderBasket(); };
$('b-clear').onclick = () => { st.basket.clear(); saveBasket(); render(); };
$('b-dl').onclick = () => {
  const now = new Date();
  const ids = DATA.map(a=>a.id).filter(id=>st.basket.has(id));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob(bundle(ids, st.lang, now), now));
  a.download = `accelerator-skills-${REF}.zip`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
};
$('q').oninput = e => { st.q = e.target.value.trim().toLowerCase(); render(); };
$('reset').onclick = () => { st.q=''; $('q').value=''; st.topics.clear(); st.ap.clear(); st.nw.clear();
  document.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false')); render(); };
function setView(v){ st.view=v; try{localStorage.setItem('skillmap-view',v);}catch(e){} render(); }
function setLang(l){ st.lang=l; try{localStorage.setItem('skillmap-lang',l);}catch(e){} i18n(); render(); }
$('v-tree').onclick = () => setView('tree');
$('v-matrix').onclick = () => setView('matrix');
$('l-en').onclick = () => setLang('en');
$('l-ru').onclick = () => setLang('ru');
i18n(); render();
</script>
